apply plugin: 'com.android.application'

android {
    namespace 'uk.co.blustudio.blubox360'
    compileSdk 36

    defaultConfig {
        applicationId 'uk.co.blustudio.blubox360'
        minSdk 29
        targetSdk 35
        versionCode 28
        versionName '0.16.1-alpha'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug {
            debuggable true
            versionNameSuffix '-preview'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':emulator-core')
}
