name: Publish notarized BluBox 360 macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notarized-macos-release:
    runs-on: macos-15
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}

    steps:
      - name: Check out BluBox 360
        uses: actions/checkout@v4
        with:
          ref: macos-preview

      - name: Check Apple release credentials
        run: |
          set -euo pipefail
          for value in \
            APPLE_SIGNING_IDENTITY \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_KEY_BASE64; do
            if [[ -z "${!value:-}" ]]; then
              echo "Missing GitHub Actions secret: $value" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/blubox-signing.keychain-db"
          cert="$RUNNER_TEMP/developer-id.p12"
          password=$(openssl rand -hex 24)

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security find-identity -v -p codesigning "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Create App Store Connect notary key
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          echo "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_NOTARY_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Download verified Xenia-Edge Metal engines
        run: |
          set -euo pipefail
          mkdir -p macos/ExternalDownloads macos/ExternalEngines/arm64 macos/ExternalEngines/x86_64
          curl -L --fail --retry 3 -o macos/ExternalDownloads/xenia-arm64.dmg https://github.com/wmarti/xenia-mac/releases/download/v0.2.1/xenia_edge_macos_arm64_v0.2.1.dmg
          curl -L --fail --retry 3 -o macos/ExternalDownloads/xenia-x86_64.dmg https://github.com/wmarti/xenia-mac/releases/download/v0.2.1/xenia_edge_macos_x86_64_v0.2.1.dmg
          echo '351c67156e040f9ca854b6160edd536d4eae1513d1a891b5d2df339a56dac90a  macos/ExternalDownloads/xenia-arm64.dmg' | shasum -a 256 -c -
          echo '70569c77c443f12faccd638d65a0b920125076eccad5914121a38133d7014577  macos/ExternalDownloads/xenia-x86_64.dmg' | shasum -a 256 -c -

          extract_engine() {
            local dmg="$1"
            local destination="$2"
            local mountpoint
            mountpoint=$(mktemp -d /tmp/blubox-xenia.XXXXXX)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
            local source_app
            source_app=$(find "$mountpoint" -maxdepth 2 -type d -name '*.app' -print -quit)
            [[ -n "$source_app" ]]
            ditto "$source_app" "$destination/Xenia-Edge.app"
            hdiutil detach "$mountpoint"
            rmdir "$mountpoint" || true
          }

          extract_engine macos/ExternalDownloads/xenia-arm64.dmg macos/ExternalEngines/arm64
          extract_engine macos/ExternalDownloads/xenia-x86_64.dmg macos/ExternalEngines/x86_64

      - name: Build BluBox 360 3.0.3
        run: |
          chmod +x macos/build-macos.sh macos/notarize-release.sh
          BLUBOX_MAC_VERSION=3.0.3-preview \
          BLUBOX_XENIA_ARM_APP="$PWD/macos/ExternalEngines/arm64/Xenia-Edge.app" \
          BLUBOX_XENIA_X64_APP="$PWD/macos/ExternalEngines/x86_64/Xenia-Edge.app" \
          ./macos/build-macos.sh

      - name: Sign and notarize BluBox 360 3.0.3
        run: |
          BLUBOX_MAC_RELEASE_VERSION=3.0.3 \
          BLUBOX_MAC_BUILD_NUMBER=33 \
          BLUBOX_MAC_RELEASE_LABEL=3.0.3-preview \
          ./macos/notarize-release.sh

      - name: Verify Gatekeeper acceptance
        run: |
          set -euo pipefail
          app='macos/dist/BluBox 360.app'
          dmg='macos/dist/BluBox-360-Mac-3.0.3-preview-Universal.dmg'
          zip='macos/dist/BluBox-360-Mac-3.0.3-preview-Universal.zip'
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute --verbose=2 "$app"
          shasum -a 256 -c macos/dist/SHA256SUMS.txt
          test -s "$zip"
          test -s "$dmg"

      - name: Publish notarized macOS 3.0.3 preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='mac-v3.0.3-preview'
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<'NOTES'
          ## BluBox 360 macOS 3.0.3 Preview

          This release switches BluBox 360 macOS distribution to Apple Developer ID signing and Apple notarization.

          - Designed to open normally through macOS Gatekeeper after download.
          - Includes the in-app Software Update screen and update banner.
          - Future updates replace the existing BluBox app instead of requiring an uninstall.
          - Keeps the Xenia launch-option sanitizer from 3.0.1 and 3.0.2.
          - Universal build for Apple Silicon and Intel Macs.

          The emulator backend remains experimental and individual Xbox 360 game compatibility varies.
          NOTES

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --cleanup-tag -y
          fi
          gh release create "$tag" \
            macos/dist/BluBox-360-Mac-3.0.3-preview-Universal.zip \
            macos/dist/BluBox-360-Mac-3.0.3-preview-Universal.dmg \
            macos/dist/SHA256SUMS.txt \
            --target macos-preview \
            --title 'BluBox 360 macOS 3.0.3 Preview' \
            --notes-file "$notes" \
            --prerelease
