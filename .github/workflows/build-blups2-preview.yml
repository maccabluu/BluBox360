name: Build BluPS2 Android preview
on:
  push:
    branches: [blups2-preview]
    paths: ['blups2/**', '.github/workflows/build-blups2-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build BluPS2 ARM64 preview
        working-directory: blups2
        run: gradle :app:assembleRelease --stacktrace
      - name: Prepare APK
        run: |
          cp blups2/app/build/outputs/apk/release/app-release-unsigned.apk BluPS2-0.1.0-preview-arm64.apk
          shasum -a 256 BluPS2-0.1.0-preview-arm64.apk > BluPS2-0.1.0-preview-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BluPS2-0.1.0-preview-arm64
          path: |
            BluPS2-0.1.0-preview-arm64.apk
            BluPS2-0.1.0-preview-SHA256.txt
