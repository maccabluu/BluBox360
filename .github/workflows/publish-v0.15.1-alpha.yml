name: Publish BluBox 360 v0.15.1 alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.15.1-alpha.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BluBox 360
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Load permanent BluBox signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BLUBOX_ALPHA_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.BLUBOX_ALPHA_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.BLUBOX_ALPHA_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.BLUBOX_ALPHA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Missing BLUBOX_ALPHA_KEYSTORE_B64}"
          : "${KEYSTORE_PASS:?Missing BLUBOX_ALPHA_KEYSTORE_PASS}"
          : "${KEY_PASS:?Missing BLUBOX_ALPHA_KEY_PASS}"
          : "${KEY_ALIAS:?Missing BLUBOX_ALPHA_KEY_ALIAS}"

          keystore="$RUNNER_TEMP/blubox-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"

          expected='9A16E3E453BF32718CD667E9C93F01594B4EF98DB6C7D383C7EFBB5765949F9D'
          actual=$(keytool -list -v \
            -keystore "$keystore" \
            -storepass "$KEYSTORE_PASS" \
            -alias "$KEY_ALIAS" 2>/dev/null \
            | awk '/SHA256:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')
          if [[ "$actual" != "$expected" ]]; then
            echo "Refusing to sign with an unexpected certificate." >&2
            echo "Expected SHA-256: $expected" >&2
            echo "Received SHA-256: ${actual:-none}" >&2
            exit 1
          fi

          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
          printf '%s' "$KEYSTORE_PASS" > "$RUNNER_TEMP/blubox-store-pass"
          printf '%s' "$KEY_PASS" > "$RUNNER_TEMP/blubox-key-pass"
          printf '%s' "$KEY_ALIAS" > "$RUNNER_TEMP/blubox-key-alias"

      - name: Build permanently signed ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build-direct.sh
          BLUBOX_KEYSTORE='${{ steps.signing.outputs.keystore }}' \
          BLUBOX_KEYSTORE_PASS="$(cat "$RUNNER_TEMP/blubox-store-pass")" \
          BLUBOX_KEY_PASS="$(cat "$RUNNER_TEMP/blubox-key-pass")" \
          BLUBOX_KEY_ALIAS="$(cat "$RUNNER_TEMP/blubox-key-alias")" \
          ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
          ./build-direct.sh

      - name: Verify permanent certificate and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/BluBox-360-0.15.1-alpha-arm64.apk"
          test -f "$apk"

          cert_output=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs "$apk")
          echo "$cert_output"
          actual=$(printf '%s\n' "$cert_output" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')
          expected='9A16E3E453BF32718CD667E9C93F01594B4EF98DB6C7D383C7EFBB5765949F9D'
          if [[ "$actual" != "$expected" ]]; then
            echo "Signed APK certificate does not match the permanent BluBox certificate." >&2
            exit 1
          fi

          sha256sum "$apk" | sed 's#app/build/outputs/apk/release/##' > SHA256SUMS.txt
          {
            echo "BluBox 360 0.15.1-alpha"
            echo "Signing mode: permanent"
            echo "Permanent certificate SHA-256: 9A:16:E3:E4:53:BF:32:71:8C:D6:67:E9:C9:3F:01:59:4B:4E:F9:8D:B6:C7:D3:83:C7:EF:BB:57:65:94:9F:9D"
            echo
            printf '%s\n' "$cert_output"
          } > SIGNING.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.15.1-alpha"
          apk="app/build/outputs/apk/release/BluBox-360-0.15.1-alpha-arm64.apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" SHA256SUMS.txt SIGNING.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "BluBox 360 0.15.1 public alpha" \
              --notes-file RELEASE_NOTES_0.15.1-alpha.md \
              --prerelease
          else
            gh release create "$tag" "$apk" SHA256SUMS.txt SIGNING.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "BluBox 360 0.15.1 public alpha" \
              --notes-file RELEASE_NOTES_0.15.1-alpha.md \
              --prerelease
          fi
