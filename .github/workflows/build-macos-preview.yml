name: Build BluBox 360 macOS preview

on:
  push:
    branches:
      - macos-preview
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos-preview.yml'
  workflow_dispatch:

jobs:
  build-macos-preview:
    runs-on: macos-14
    steps:
      - name: Check out BluBox 360
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run Apple Silicon JIT host probe
        run: |
          mkdir -p macos/CoreProbe/build
          clang -arch arm64 -mmacosx-version-min=13.0 \
            macos/CoreProbe/jit_probe.c \
            -o macos/CoreProbe/build/blubox-jit-probe
          file macos/CoreProbe/build/blubox-jit-probe
          macos/CoreProbe/build/blubox-jit-probe

      - name: Build universal Mac 2.2 preview
        run: |
          chmod +x macos/build-macos.sh
          BLUBOX_MAC_VERSION=2.2.0-preview ./macos/build-macos.sh

      - name: Verify app and startup
        run: |
          app='macos/dist/BluBox 360.app'
          binary="$app/Contents/MacOS/BluBox360"
          file "$binary"
          lipo -info "$binary"
          lipo -archs "$binary" | grep -q arm64
          lipo -archs "$binary" | grep -q x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" | grep -q '^2.2.0$'
          "$binary" --self-test | grep -q 'startup self-test passed'
          shasum -a 256 -c macos/dist/SHA256SUMS.txt

      - name: Upload Mac 2.2 preview build
        uses: actions/upload-artifact@v4
        with:
          name: BluBox-360-Mac-2.2.0-preview-Universal
          path: |
            macos/dist/BluBox-360-Mac-2.2.0-preview-Universal.zip
            macos/dist/BluBox-360-Mac-2.2.0-preview-Universal.dmg
            macos/dist/SHA256SUMS.txt
          if-no-files-found: error
